# This workflow publishes test results from the CI workflow.
# It runs separately using workflow_run trigger to support fork PRs,
# which cannot create check runs directly due to GitHub security restrictions.
# See: https://github.com/EnricoMi/publish-unit-test-result-action#support-fork-repositories-and-dependabot-branches

name: Publish Test Results

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  checks: write
  pull-requests: write
  actions: read

jobs:
  publish-unit-test-results:
    name: Publish Unit Test Results (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17"]

    steps:
      - name: Download Unit Test Results
        uses: actions/download-artifact@v5
        with:
          name: unit-test-results-java-${{ matrix.java }}
          path: test-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: Unit Tests (Java ${{ matrix.java }})
          files: 'test-results/**/TEST-*.xml'
          comment_mode: off
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: ${{ github.event_path }}
          event_name: ${{ github.event.workflow_run.event }}

  publish-integration-test-results:
    name: Publish Integration Test Results (Java ${{ matrix.java }}, C* ${{ matrix.cassandra }})
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17"]
        cassandra: ["4.0", "4.1", "5.0", "5.1"]

    steps:
      - name: Download Lightweight Test Results
        uses: actions/download-artifact@v5
        with:
          name: integration-lightweight-results-java-${{ matrix.java }}-cassandra-${{ matrix.cassandra }}
          path: test-results/lightweight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Download Heavyweight Test Results
        uses: actions/download-artifact@v5
        with:
          name: integration-heavyweight-results-java-${{ matrix.java }}-cassandra-${{ matrix.cassandra }}
          path: test-results/heavyweight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: Integration Tests (Java ${{ matrix.java }}, C* ${{ matrix.cassandra }})
          files: 'test-results/**/TEST-*.xml'
          comment_mode: off
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: ${{ github.event_path }}
          event_name: ${{ github.event.workflow_run.event }}
